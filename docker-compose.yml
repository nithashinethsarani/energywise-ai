services:
  backend:
    build: ./backend
    container_name: energywise-backend
    restart: unless-stopped
    volumes:
      - energywise-data:/data
    environment:
      - DB_PATH=/data/energywise.db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: energywise-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  energywise-data:
